<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>발제문 · 성찰 — 조니딥 JourneyDeep</title>
<link rel="icon" href="../favicon.png" type="image/png">
<meta name="description" content="모임에서 나눈 발제와 질문들을 기록합니다.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F4F6FA;--wh:#FFFFFF;--be:#E8ECF4;--sa:#D5DCF0;--ac:#2563EB;--te:#1A3A8F;--dk:#0F172A;--ol:#64748B;--tp:#0F172A;--ts:#334155;--tl:#64748B;--dm:#64748B;--sw:rgba(15,23,42,.06);--sd:rgba(37,99,235,.18)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--tp);overflow-x:hidden;line-height:1.8}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 2.5rem;height:68px;display:flex;align-items:center;justify-content:space-between;transition:all .4s;background:transparent;}
.nav.scrolled{background:rgba(15,23,42,.92);backdrop-filter:blur(20px)}
.nav-logo{display:flex;align-items:flex-start;flex-direction:column;text-decoration:none;color:#fff;line-height:1.15}.nav-logo-icon{display:none}.nav-logo-text{font-family:'DM Sans',sans-serif;font-weight:800;font-size:.95rem;letter-spacing:.01em;color:#fff}
.nav-logo-sub{font-family:'DM Sans',sans-serif;font-size:.7rem;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.02em}
.nav-links{display:flex;align-items:center;gap:0;list-style:none}
.nav-li{position:relative}
.nav-link-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:.5rem 1rem;gap:.05rem;transition:color .25s;cursor:pointer}
.nav-link-main{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);transition:color .25s;letter-spacing:.06em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
.nav-link-sub{display:none}
.nav-li:hover .nav-link-main{color:#fff}
.nav-li::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:0;height:1px;background:#fff;transition:width .3s}
.nav-li:hover::after{width:60%}
.nav-cta-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.4rem;background:var(--ac);color:#fff;text-decoration:none;border-radius:4px;font-size:.82rem;font-weight:700;letter-spacing:.04em;font-family:'DM Sans',sans-serif;transition:all .3s;margin-left:1rem}.nav-cta-btn:hover{background:#1D4ED8;transform:translateY(-1px)}
.nav-dropdown{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:rgba(244,246,250,.98);backdrop-filter:blur(24px);border:1px solid rgba(37,99,235,.12);border-radius:0;padding:.6rem;min-width:180px;box-shadow:0 20px 60px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-8px);transition:all .22s cubic-bezier(.4,0,.2,1);z-index:100}
.nav-li:hover .nav-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.nav-dd-item{display:block;padding:.55rem 1rem;font-size:.85rem;color:var(--ts);text-decoration:none;border-radius:0;transition:all .15s;white-space:nowrap;font-weight:500}
.nav-dd-item:hover{background:rgba(37,99,235,.08);color:var(--ac)}
.nav-dd-divider{height:1px;background:rgba(0,0,0,.08);margin:.4rem .6rem}
.mobile-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;z-index:10000;position:relative}.mobile-toggle span{width:24px;height:2px;background:rgba(255,255,255,.85);border-radius:0;transition:transform .3s,opacity .3s,background .3s}
.section{padding:7rem 2rem}.section-container{max-width:1100px;margin:0 auto}
.section-eyebrow{font-family:'DM Sans',sans-serif;font-size:.9rem;font-style:italic;color:var(--ac);letter-spacing:.1em;margin-bottom:.75rem}
.section-title{font-family:'DM Sans',sans-serif;font-size:clamp(1.8rem,3.5vw,2.5rem);font-weight:600;color:var(--dk);letter-spacing:-.02em;line-height:1.4;margin-bottom:1.5rem}
.section-desc{font-size:1rem;color:var(--ts);line-height:1.9;max-width:600px}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:6rem 2rem 4rem}
.hero-bg{position:absolute;inset:0}.hero-bg-circle{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.hero-bg-circle:nth-child(1){width:600px;height:600px;background:var(--sa);top:-15%;right:-10%;animation:f1 20s ease-in-out infinite}
.hero-bg-circle:nth-child(2){width:500px;height:500px;background:var(--te);bottom:-20%;left:-10%;opacity:.2;animation:f2 25s ease-in-out infinite}
.hero-bg-circle:nth-child(3){width:300px;height:300px;background:var(--ol);top:40%;left:30%;opacity:.15}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.05)}}@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px) scale(1.08)}}
.hero-content{position:relative;z-index:1;text-align:center;max-width:800px}
.hero-label{display:inline-block;padding:.4rem 1.2rem;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);border-radius:4px;font-size:.8rem;font-weight:500;color:var(--ac);letter-spacing:.1em;margin-bottom:2rem;animation:fU .8s ease both}
.hero-title{font-family:'DM Sans',sans-serif;font-size:clamp(2.8rem,6vw,4.5rem);font-weight:700;line-height:1.3;color:var(--dk);margin-bottom:.5rem;animation:fU .8s ease .15s both}
.hero-title .accent{background:linear-gradient(135deg,var(--ac),var(--te));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-subtitle{font-family:'DM Sans',sans-serif;font-size:clamp(1.1rem,2.5vw,1.5rem);font-style:italic;color:var(--tl);margin-bottom:2rem;animation:fU .8s ease .3s both}
.hero-desc{font-size:1.05rem;line-height:2;color:var(--ts);max-width:560px;margin:0 auto 3rem;animation:fU .8s ease .45s both}
.hero-cta{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;background:linear-gradient(135deg,var(--dk),#1E3A8A);color:#F4F6FA;text-decoration:none;border-radius:4px;font-size:.95rem;font-weight:500;transition:all .4s;box-shadow:0 4px 20px var(--sd);animation:fU .8s ease .6s both}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--sd)}.hero-cta svg{width:18px;height:18px;transition:transform .3s}.hero-cta:hover svg{transform:translateX(3px)}
@keyframes fU{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.about{background:var(--wh)}.about::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--sa),transparent)}
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem;margin-top:4rem}
.value-card{padding:2.5rem 2rem;border-radius:0;background:var(--bg);border:1px solid rgba(100,116,139,.5);transition:all .5s;position:relative;overflow:hidden}
.value-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--te));transform:scaleX(0);transform-origin:left;transition:transform .5s}.value-card:hover::before{transform:scaleX(1)}.value-card:hover{transform:translateY(-4px);box-shadow:0 20px 60px var(--sw)}
.value-icon{width:52px;height:52px;border-radius:0;background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(30,58,138,.1));display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;font-size:1.5rem}
.value-card h3{font-family:'DM Sans',sans-serif;font-size:1.15rem;font-weight:600;color:var(--dk);margin-bottom:.75rem}.value-card p{font-size:.92rem;color:var(--ts);line-height:1.8}
.season-banner{background:linear-gradient(135deg,#0F172A,#1E3A8A,#1D4ED8);position:relative;overflow:hidden;text-align:center}
.season-badge{display:inline-block;padding:.35rem 1rem;background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.4);border-radius:4px;font-size:.8rem;font-weight:600;color:var(--ac);letter-spacing:.12em;margin-bottom:1.5rem}
.season-banner .section-title{color:#FFFFFF}.season-banner .section-desc{color:rgba(255,255,255,.65);margin:0 auto 2.5rem;text-align:center}
.season-cta{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;background:var(--ac);color:#fff;text-decoration:none;border-radius:4px;font-weight:600;transition:all .4s;box-shadow:0 4px 20px rgba(37,99,235,.3)}.season-cta:hover{transform:translateY(-2px)}
.cta-outline{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;background:transparent;border:2px solid var(--ac);color:var(--ac);text-decoration:none;border-radius:4px;font-weight:600;transition:all .4s}.cta-outline:hover{background:rgba(37,99,235,.1);transform:translateY(-2px)}
.cta-group{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;margin-top:.5rem}
.hero-cta-outline{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;background:transparent;border:2px solid rgba(255,255,255,.3);color:var(--dk);text-decoration:none;border-radius:4px;font-size:.95rem;font-weight:500;transition:all .4s;animation:fU .8s ease .7s both}.hero-cta-outline:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px)}
.program{background:var(--bg)}.program-layout{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;margin-top:3rem}
.program-image-stack{display:flex;gap:1.5rem;align-items:flex-end;justify-content:center}
.program-img{flex:1;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 16px 40px var(--sd);transition:transform .4s}
.program-img:hover{transform:translateY(-6px)}
.program-img:nth-child(1){background:linear-gradient(135deg,#64748B,#475569)}
.program-img:nth-child(2){background:linear-gradient(135deg,#334155,#1E40AF);transform:translateY(-16px)}
.program-img:nth-child(2):hover{transform:translateY(-22px)}
.program-img:nth-child(3){background:linear-gradient(135deg,#5A6B4F,#4A5B40)}
.program-img img{width:100%;height:100%;object-fit:cover}.program-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;font-weight:500;font-style:normal;text-shadow:0 1px 4px rgba(0,0,0,.3);letter-spacing:.02em}
.program-details h3{font-family:'DM Sans',sans-serif;font-size:1.3rem;font-weight:600;color:var(--dk);margin-bottom:1.5rem}
.program-list{list-style:none;display:flex;flex-direction:column;gap:1.25rem}.program-list li{display:flex;align-items:flex-start;gap:1rem;font-size:.95rem;color:var(--ts);line-height:1.7}
.program-list-icon{width:28px;height:28px;border-radius:0;background:rgba(37,99,235,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
.gallery{background:var(--wh);overflow:hidden}
.gallery-track{display:flex;gap:1.5rem;margin-top:3rem;animation:gS 30s linear infinite;width:max-content}.gallery-track:hover{animation-play-state:paused}
.gallery-insta-wrap{margin-top:2.5rem;width:100%;overflow:hidden}
.gallery-insta-placeholder{margin-top:2.5rem;padding:3rem;text-align:center;font-size:.95rem;color:var(--tl);background:var(--bg);border-radius:0;border:2px dashed var(--bd)}
.gallery-item{width:320px;height:220px;border-radius:0;overflow:hidden;flex-shrink:0;background:var(--be);box-shadow:0 8px 30px var(--sw);transition:transform .4s}.gallery-item:hover{transform:scale(1.03)}
.gallery-item img{width:100%;height:100%;object-fit:cover}.gallery-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;opacity:.3}
@keyframes gS{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.booklist{background:var(--bg)}
.book-filter-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2.5rem;margin-bottom:2rem}
.book-tab{padding:.4rem 1rem;border-radius:0;border:1px solid rgba(37,99,235,.4);background:transparent;color:var(--tl);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Pretendard',sans-serif}
.book-tab:hover{border-color:var(--ac);color:var(--ac)}
.book-tab.active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.book-card{display:flex;align-items:center;gap:1.25rem;padding:1.25rem 1.5rem;background:var(--wh);border-radius:0;border:1px solid rgba(100,116,139,.4);transition:all .4s}
.book-card:hover{transform:translateY(-2px);box-shadow:0 12px 40px var(--sw)}
.book-card.hidden{display:none}
.book-cover{width:48px;height:64px;border-radius:0;background:linear-gradient(135deg,var(--sa),var(--ac));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.book-info h4{font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;color:var(--dk);margin-bottom:.2rem}.book-info .book-author{font-size:.75rem;color:var(--ac);margin-bottom:.15rem}.book-info p{font-size:.75rem;color:var(--tl)}
.book-grid-v{display:grid;grid-template-columns:repeat(5,1fr);gap:1.25rem;margin-top:2.5rem}
@media(max-width:900px){.book-grid-v{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.book-grid-v{grid-template-columns:repeat(2,1fr)}}
.book-card-v{background:var(--wh);border-radius:0;border:1px solid rgba(100,116,139,.35);overflow:hidden;transition:all .4s}
.book-card-v:hover{transform:translateY(-3px);box-shadow:0 12px 32px var(--sw)}
.book-cover-v{width:100%;aspect-ratio:2/3;overflow:hidden;background:var(--be)}
.book-info-v{padding:.85rem .9rem}
.book-season-tag{font-size:.65rem;font-weight:700;color:var(--ac);letter-spacing:.08em;margin-bottom:.3rem;opacity:.85}
.book-info-v h4{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;color:var(--dk);line-height:1.45;margin-bottom:.2rem}
.book-author-v{font-size:.72rem;color:var(--tl)}
.history{background:var(--wh)}.timeline{margin-top:3.5rem;position:relative;padding-left:3rem}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--ac),var(--sa),transparent)}
.timeline-item{position:relative;margin-bottom:2.5rem;padding-bottom:2.5rem;border-bottom:1px solid rgba(100,116,139,.3)}.timeline-item:last-child{border-bottom:none}
.timeline-dot{position:absolute;left:-3rem;top:4px;width:14px;height:14px;border-radius:50%;background:var(--ac);border:3px solid var(--wh);box-shadow:0 0 0 2px var(--ac)}
.timeline-item:first-child .timeline-dot{background:var(--te);box-shadow:0 0 0 2px var(--te),0 0 12px rgba(30,58,138,.3)}
.timeline-season{font-family:'DM Sans',sans-serif;font-size:.85rem;font-style:italic;color:var(--ac);margin-bottom:.25rem}
.timeline-title{font-family:'DM Sans',sans-serif;font-size:1.1rem;font-weight:600;color:var(--dk);margin-bottom:.5rem}.timeline-desc{font-size:.9rem;color:var(--ts);line-height:1.7}
.timeline-link{display:inline-block;margin-top:.5rem;font-size:.85rem;color:var(--ac);text-decoration:none;transition:color .3s}.timeline-link:hover{color:var(--te)}
.faq-section{background:var(--bg)}.faq-list{margin-top:3rem;max-width:700px}
.faq-item{border-bottom:1px solid rgba(100,116,139,.4);padding:1.5rem 0}
.faq-q{font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:600;color:var(--dk);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem}.faq-q::after{content:'+';font-size:1.2rem;color:var(--ac);transition:transform .3s}.faq-item.open .faq-q::after{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s,padding .4s;font-size:.95rem;color:var(--ts);line-height:1.8}.faq-item.open .faq-a{max-height:300px;padding-top:1rem}
.testimonials{background:var(--wh)}.testi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2rem;margin-top:3rem}
.testi-card{padding:2rem;background:var(--bg);border-radius:0;border:1px solid rgba(100,116,139,.4);position:relative}
.testi-card::before{content:'"';position:absolute;top:1rem;left:1.5rem;font-family:'DM Sans',sans-serif;font-size:4rem;color:var(--ac);opacity:.3;line-height:1}
.testi-text{font-size:.95rem;color:var(--ts);line-height:1.8;margin-bottom:1.25rem;padding-top:1.5rem}.testi-author{font-size:.85rem;font-weight:600;color:var(--dk)}.testi-season{font-size:.78rem;color:var(--tl)}
.schedule{background:var(--bg)}.schedule-table{margin-top:3rem;width:100%;max-width:700px}
.schedule-row{display:grid;grid-template-columns:160px 1fr auto;gap:1.5rem;padding:1.5rem 1.25rem;border-bottom:1px solid rgba(100,116,139,.35);align-items:center;border-radius:0;transition:background .2s}.schedule-row:hover{background:rgba(100,116,139,.2)}
.schedule-date{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;color:var(--ac)}.schedule-event{font-size:1rem;color:var(--dk);font-weight:600;letter-spacing:-.01em}
.schedule-note{font-size:.8rem;color:#1E3A8A;padding:.3rem .9rem;background:rgba(37,99,235,.2);border-radius:4px;font-weight:500;border:1px solid rgba(37,99,235,.4);white-space:nowrap}
.people{background:var(--wh)}.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2rem;margin-top:3rem}
.person-card{text-align:center;padding:2rem 1.5rem;background:var(--bg);border-radius:0;border:1px solid rgba(100,116,139,.4);transition:all .4s}.person-card:hover{transform:translateY(-4px);box-shadow:0 16px 50px var(--sw)}
.person-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 1rem;background:linear-gradient(135deg,var(--sa),var(--ac));display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;overflow:hidden}.person-avatar img{width:100%;height:100%;object-fit:cover}
.person-card h4{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;color:var(--dk);margin-bottom:.25rem}.person-card p{font-size:.8rem;color:var(--tl)}
.contact{background:#0F172A;color:#FFFFFF;text-align:center;padding:5rem 2rem}
.contact .section-eyebrow{color:rgba(37,99,235,.8)}.contact .section-title{color:#FFFFFF}.contact .section-desc{color:rgba(255,255,255,.55);margin:0 auto 2.5rem}
.contact-links{display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}
.contact-link{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.75rem;border:1px solid rgba(37,99,235,.3);border-radius:4px;color:var(--ac);text-decoration:none;font-size:.9rem;font-weight:500;transition:all .3s}.contact-link:hover{background:rgba(37,99,235,.1);border-color:var(--ac)}
.footer{background:#0F172A;padding:2rem;text-align:center}.footer p{font-size:.8rem;color:rgba(255,255,255,.3)}
.apply-section{background:linear-gradient(135deg,#EEF2FF,#DBEAFE);text-align:center;padding:6rem 2rem;position:relative;overflow:hidden}
.apply-section::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(37,99,235,.12) 0%,transparent 70%)}
.apply-section .section-title{color:var(--dk);margin-bottom:1rem}
.apply-section .section-desc{color:var(--ts);margin:0 auto 2.5rem;text-align:center;max-width:500px}
.apply-cta-btn{display:inline-flex;align-items:center;gap:.75rem;padding:1.1rem 3rem;background:linear-gradient(135deg,var(--ac),var(--te));color:#fff;text-decoration:none;border-radius:4px;font-size:1.05rem;font-weight:600;transition:all .4s;box-shadow:0 8px 30px rgba(37,99,235,.35)}.apply-cta-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(37,99,235,.45)}
.reveal,.reveal.visible{opacity:1;transform:none}
.reveal-delay-1{transition-delay:.1s}.reveal-delay-2{transition-delay:.2s}.reveal-delay-3{transition-delay:.3s}
.page-header{padding:8rem 2rem 4rem;text-align:center;background:var(--wh);position:relative}
.page-header h1{font-family:'DM Sans',sans-serif;font-size:clamp(2rem,4vw,3rem);font-weight:700;color:var(--dk);margin-bottom:.75rem}

  <h1 style="font-family:'DM Sans',sans-serif;font-size:2.2rem;font-weight:600;color:var(--dk);line-height:1.3;margin-bottom:.75rem">발제문 · 성찰</h1>
  <p style="font-size:.97rem;color:var(--tl);line-height:1.8;margin-bottom:2.5rem">모임에서 나눈 발제와 생각들을 기록합니다.</p>

  <!-- 탭 -->
  <div style="display:flex;gap:0;border-bottom:2px solid var(--be);margin-bottom:2rem">
    <button id="tab-btn-proposal" onclick="switchMainTab('proposal')" style="padding:.65rem 1.4rem;font-size:.88rem;font-weight:700;color:var(--ac);background:none;border:none;border-bottom:2px solid var(--ac);margin-bottom:-2px;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .2s">발제문</button>
    <button id="tab-btn-reflection" onclick="switchMainTab('reflection')" style="padding:.65rem 1.4rem;font-size:.88rem;font-weight:500;color:var(--tl);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .2s">성찰</button>
  </div>

  <!-- 발제문 탭 -->

    <div id="season-filter" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem"></div>

</div>

<script>
var SU='https://dvlrzbckneucpvlacdll.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';
var allProposals=[], activeSeason='전체';

function loadProposals(){
  fetch(SU+'/rest/v1/JD_proposals?select=*&order=created_at.desc',{
    headers:{'apikey':SK,'Authorization':'Bearer '+SK}
  }).then(function(r){return r.json();}).then(function(data){
    if(!Array.isArray(data)){renderProposals([]);return;}
    allProposals=data.filter(function(p){return p.visible!==false;});
    buildSeasonFilter(allProposals);
    renderProposals(allProposals);
  }).catch(function(){renderProposals([]);});
}

function buildSeasonFilter(data){
  var seasons=[];
  data.forEach(function(p){if(p.season&&seasons.indexOf(p.season)<0)seasons.push(p.season);});
  if(seasons.length<2)return;
  var wrap=document.getElementById('season-filter');
  var allBtn=document.createElement('button');
  allBtn.textContent='전체';
  allBtn.className='sf-btn active';
  allBtn.style.cssText='padding:.35rem .9rem;border:1px solid rgba(37,99,235,.4);background:rgba(37,99,235,.1);color:#2563EB;font-size:.8rem;font-weight:700;cursor:pointer;letter-spacing:.04em;';
  allBtn.onclick=function(){filterSeason(this,'전체');};
  wrap.appendChild(allBtn);
  seasons.forEach(function(s){
    var btn=document.createElement('button');
    btn.textContent=s;
    btn.className='sf-btn';
    btn.style.cssText='padding:.35rem .9rem;border:1px solid rgba(100,116,139,.3);background:transparent;color:var(--tl);font-size:.8rem;font-weight:600;cursor:pointer;letter-spacing:.04em;';
    btn.onclick=function(){filterSeason(this,s);};
    wrap.appendChild(btn);
  });
}

function filterSeason(btn,season){
  document.querySelectorAll('.sf-btn').forEach(function(b){
    b.style.background='transparent';b.style.color='var(--tl)';b.style.borderColor='rgba(100,116,139,.3)';
  });
  btn.style.background='rgba(37,99,235,.1)';btn.style.color='#2563EB';btn.style.borderColor='rgba(37,99,235,.4)';
  activeSeason=season;
  var filtered=season==='전체'?allProposals:allProposals.filter(function(p){return p.season===season;});
  renderProposals(filtered);
}

function renderProposals(data){
  var list=document.getElementById('proposals-list');
  if(!data.length){
    list.innerHTML='<p style="color:var(--tl);font-size:.9rem;padding:1rem 0">아직 등록된 발제문이 없어요.</p>';
    return;
  }
  list.innerHTML=data.map(function(p){
    return '<div style="padding:1.5rem 2rem;background:var(--wh);border:1px solid rgba(100,116,139,.3);margin-bottom:1rem;cursor:pointer;transition:all .3s" onclick="toggleProposal(this,\''+p.id+'\')" onmouseover="this.style.borderColor=\'#2563EB\'" onmouseout="if(!this.classList.contains(\'open\'))this.style.borderColor=\'rgba(100,116,139,.3)\'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem">'
      +'<div>'
      +'<div style="font-size:.72rem;font-weight:700;color:#2563EB;letter-spacing:.1em;margin-bottom:.4rem">'+(p.season||'')+(p.session_number?' · '+p.session_number:'')+'</div>'
      +'<h3 style="font-family:\'DM Sans\',sans-serif;font-size:1.05rem;font-weight:600;color:var(--dk);line-height:1.5;margin-bottom:.25rem">'+p.book_title+'</h3>'
      +'<p style="font-size:.82rem;color:var(--tl)">발제자: '+(p.author_name||'—')+'</p>'
      +'</div>'
      +'<span class="pr-arrow" style="font-size:1.2rem;color:var(--tl);transition:transform .3s;flex-shrink:0">+</span>'
      +'</div>'
      +'<div class="pr-body" style="display:none;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid rgba(100,116,139,.15);font-size:.92rem;color:var(--ts);line-height:1.9;white-space:pre-wrap">'+escHtml(p.content||'')+'</div>'
      +(p.file_url?'<a href="'+p.file_url+'" target="_blank" style="display:inline-block;margin-top:1rem;font-size:.82rem;color:#2563EB;text-decoration:none">첨부파일 보기 →</a>':'')
      +'</div>';
  }).join('');
}

function toggleProposal(el,id){
  var body=el.querySelector('.pr-body');
  var arrow=el.querySelector('.pr-arrow');
  var isOpen=el.classList.contains('open');
  el.classList.toggle('open');
  body.style.display=isOpen?'none':'block';
  arrow.textContent=isOpen?'+':'×';
  el.style.borderColor=isOpen?'rgba(100,116,139,.3)':'#2563EB';
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── 탭 전환 ──────────────────────────────────────────
var _activeTab = 'proposal';
function switchMainTab(tab) {
  _activeTab = tab;
  document.getElementById('tab-proposal').style.display = tab==='proposal'?'':'none';
  document.getElementById('tab-reflection').style.display = tab==='reflection'?'':'none';
  var pb = document.getElementById('tab-btn-proposal');
  var rb = document.getElementById('tab-btn-reflection');
  pb.style.color = tab==='proposal'?'var(--ac)':'var(--tl)';
  pb.style.fontWeight = tab==='proposal'?'700':'500';
  pb.style.borderBottomColor = tab==='proposal'?'var(--ac)':'transparent';
  rb.style.color = tab==='reflection'?'var(--ac)':'var(--tl)';
  rb.style.fontWeight = tab==='reflection'?'700':'500';
  rb.style.borderBottomColor = tab==='reflection'?'var(--ac)':'transparent';
  if (tab==='reflection' && !_reflLoaded) loadReflections();
}

// ── 성찰 로드 ─────────────────────────────────────────
var allReflections=[], activeReflSeason='전체', _reflLoaded=false;
function loadReflections(){
  _reflLoaded=true;
  fetch(SU+'/rest/v1/JD_reflections?select=*&order=submitted_at.desc',{
    headers:{'apikey':SK,'Authorization':'Bearer '+SK}
  }).then(function(r){return r.json();}).then(function(data){
    if(!Array.isArray(data)){renderReflections([]);return;}
    allReflections=data;
    buildReflSeasonFilter(data);
    renderReflections(data);
  }).catch(function(){renderReflections([]);});
}

function buildReflSeasonFilter(data){
  var seasons=[];
  data.forEach(function(r){
    var s=extractSeason(r.session);
    if(s&&seasons.indexOf(s)<0)seasons.push(s);
  });
  if(seasons.length<2)return;
  var wrap=document.getElementById('refl-season-filter');
  var allBtn=document.createElement('button');
  allBtn.textContent='전체'; allBtn.className='sf-btn active';
  allBtn.style.cssText='padding:.35rem .9rem;border:1px solid rgba(37,99,235,.4);background:rgba(37,99,235,.1);color:#2563EB;font-size:.8rem;font-weight:700;cursor:pointer;letter-spacing:.04em;';
  allBtn.onclick=function(){filterReflSeason(this,'전체');};
  wrap.appendChild(allBtn);
  seasons.forEach(function(s){
    var btn=document.createElement('button');
    btn.textContent=s; btn.className='sf-btn';
    btn.style.cssText='padding:.35rem .9rem;border:1px solid rgba(100,116,139,.3);background:transparent;color:var(--tl);font-size:.8rem;font-weight:600;cursor:pointer;letter-spacing:.04em;';
    btn.onclick=function(){filterReflSeason(this,s);};
    wrap.appendChild(btn);
  });
}

function extractSeason(session){
  if(!session)return'';
  var m=session.match(/시즌\s*\d+/);
  return m?m[0]:'';
}

function filterReflSeason(btn,season){
  document.querySelectorAll('#refl-season-filter .sf-btn').forEach(function(b){
    b.style.background='transparent';b.style.color='var(--tl)';b.style.borderColor='rgba(100,116,139,.3)';
  });
  btn.style.background='rgba(37,99,235,.1)';btn.style.color='#2563EB';btn.style.borderColor='rgba(37,99,235,.4)';
  activeReflSeason=season;
  var filtered=season==='전체'?allReflections:allReflections.filter(function(r){return extractSeason(r.session)===season;});
  renderReflections(filtered);
}

function renderReflections(data){
  var list=document.getElementById('reflections-list');
  if(!data.length){
    list.innerHTML='<p style="color:var(--tl);font-size:.9rem;padding:1rem 0">아직 등록된 성찰이 없어요.</p>';
    return;
  }
  list.innerHTML=data.map(function(r){
    var qs=['q1','q2','q3','q4'].filter(function(k){return r[k+'_answer'];});
    var body=qs.map(function(k){
      return '<div style="margin-bottom:.85rem">'
        +(r[k+'_label']?'<div style="font-size:.7rem;font-weight:700;color:var(--ac);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem">'+escHtml(r[k+'_label'])+'</div>':'')
        +'<div style="font-size:.9rem;color:var(--ts);line-height:1.85;white-space:pre-wrap">'+escHtml(r[k+'_answer'])+'</div>'
        +'</div>';
    }).join('');
    return '<div style="padding:1.5rem 2rem;background:var(--wh);border:1px solid rgba(100,116,139,.3);margin-bottom:1rem;cursor:pointer;transition:all .3s" onclick="toggleRefl(this)" onmouseover="this.style.borderColor=\'#2563EB\'" onmouseout="if(!this.classList.contains(\'open\'))this.style.borderColor=\'rgba(100,116,139,.3)\'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem">'
      +'<div>'
      +'<div style="font-size:.72rem;font-weight:700;color:#2563EB;letter-spacing:.1em;margin-bottom:.4rem">'+escHtml(r.session||'')+'</div>'
      +'<h3 style="font-family:\'DM Sans\',sans-serif;font-size:1.05rem;font-weight:600;color:var(--dk);line-height:1.5;margin-bottom:.25rem">'+escHtml(r.name)+'</h3>'
      +'</div>'
      +'<span class="refl-arrow" style="font-size:1.2rem;color:var(--tl);transition:transform .3s;flex-shrink:0">+</span>'
      +'</div>'
      +'<div class="refl-body" style="display:none;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid rgba(100,116,139,.15)">'+body+'</div>'
      +'</div>';
  }).join('');
}

function toggleRefl(el){
  var body=el.querySelector('.refl-body');
  var arrow=el.querySelector('.refl-arrow');
  var isOpen=el.classList.contains('open');
  el.classList.toggle('open');
  body.style.display=isOpen?'none':'block';
  arrow.textContent=isOpen?'+':'×';
  el.style.borderColor=isOpen?'rgba(100,116,139,.3)':'#2563EB';
}

loadProposals();
(function(){var SU='https://dvlrzbckneucpvlacdll.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';fetch(SU+'/rest/v1/JD_site_settings?select=key,value',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}}).then(function(r){return r.json();}).then(function(rows){if(!Array.isArray(rows))return;rows.forEach(function(row){if(row.key==='hero_proposals'&&row.value){var el=document.getElementById('ph-hero');if(el){el.style.backgroundImage='url('+row.value+')';el.style.height='220px';}}});}).catch(function(){});})();
</script>
