<style>:root{--bg:#F4F6FA;--wh:#FFFFFF;--be:#E8ECF4;--sa:#D5DCF0;--ac:#2563EB;--te:#1A3A8F;--dk:#0F172A;--ol:#64748B;--tp:#0F172A;--ts:#334155;--tl:#64748B;--dm:#64748B;--sw:rgba(15,23,42,.06);--sd:rgba(37,99,235,.18)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--tp);overflow-x:hidden;line-height:1.8}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 2.5rem;height:68px;display:flex;align-items:center;justify-content:space-between;transition:all .4s;background:rgba(15,23,42,.92);backdrop-filter:blur(20px)}
.nav-logo{display:flex;align-items:flex-start;flex-direction:column;text-decoration:none;color:#fff;line-height:1.15}.nav-logo-text{font-family:'DM Sans',sans-serif;font-weight:800;font-size:.95rem;letter-spacing:.01em;color:#fff}
.nav-logo-sub{font-family:'DM Sans',sans-serif;font-size:.7rem;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.02em}
.nav-links{display:flex;align-items:center;gap:0;list-style:none}
.nav-li{position:relative}
.nav-link-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:.5rem 1rem;gap:.05rem;transition:color .25s;cursor:pointer}
.nav-link-main{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.7);transition:color .25s;letter-spacing:.06em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
.nav-li:hover .nav-link-main{color:#fff}
.nav-li::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:0;height:1px;background:#fff;transition:width .3s}
.nav-li:hover::after{width:60%}
.nav-cta-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.4rem;background:var(--ac);color:#fff;text-decoration:none;border-radius:4px;font-size:.82rem;font-weight:700;letter-spacing:.04em;font-family:'DM Sans',sans-serif;transition:all .3s;margin-left:1rem}.nav-cta-btn:hover{background:#1D4ED8;transform:translateY(-1px)}
.nav-dropdown{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:rgba(244,246,250,.98);backdrop-filter:blur(24px);border:1px solid rgba(37,99,235,.12);border-radius:0;padding:.6rem;min-width:180px;box-shadow:0 20px 60px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-8px);transition:all .22s cubic-bezier(.4,0,.2,1);z-index:100}
.nav-li:hover .nav-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.nav-dd-item{display:block;padding:.55rem 1rem;font-size:.85rem;color:var(--ts);text-decoration:none;border-radius:0;transition:all .15s;white-space:nowrap;font-weight:500}
.nav-dd-item:hover{background:rgba(37,99,235,.08);color:var(--ac)}
.nav-dd-divider{height:1px;background:rgba(0,0,0,.08);margin:.4rem .6rem}
.mobile-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;z-index:10000;position:relative}.mobile-toggle span{width:24px;height:2px;background:rgba(255,255,255,.85);border-radius:0;transition:transform .3s,opacity .3s,background .3s}
.gl-hero{padding:7rem 2rem 4rem;text-align:center;background:linear-gradient(160deg,#0F172A,#1E3A8A)}
.gl-hero h1{font-family:'DM Sans',sans-serif;font-size:clamp(2rem,4vw,3rem);font-weight:700;color:#fff;margin-bottom:.75rem}
.gl-hero p{font-size:1rem;color:rgba(255,255,255,.6);max-width:480px;margin:0 auto}
.gl-back{display:inline-flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.5);text-decoration:none;font-size:.85rem;margin-bottom:2.5rem;transition:color .3s}
.gl-back:hover{color:#fff}
.gl-body{max-width:1200px;margin:0 auto;padding:3rem 2rem 5rem}
.gl-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem}
.gl-tab{padding:.4rem 1.1rem;border:1px solid rgba(37,99,235,.4);background:transparent;color:var(--tl);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Pretendard',sans-serif}
.gl-tab:hover{border-color:var(--ac);color:var(--ac)}
.gl-tab.active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.gl-grid{columns:3 220px;gap:1rem}
@media(max-width:600px){.gl-grid{columns:2 140px}}
.gl-item{break-inside:avoid;margin-bottom:1rem;overflow:hidden;cursor:pointer;position:relative;background:var(--be)}
.gl-item img{width:100%;display:block;transition:transform .4s}
.gl-item:hover img{transform:scale(1.04)}
.gl-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,23,42,.75) 0%,transparent 50%);opacity:0;transition:opacity .3s}
.gl-item:hover .gl-overlay{opacity:1}
.gl-caption{position:absolute;bottom:.75rem;left:.75rem;right:.75rem;color:#fff;font-size:.82rem;font-weight:500;line-height:1.4;opacity:0;transition:opacity .3s;transform:translateY(4px)}
.gl-item:hover .gl-caption{opacity:1;transform:translateY(0)}
.gl-season-tag{position:absolute;top:.6rem;left:.6rem;background:rgba(37,99,235,.85);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.08em;padding:.2rem .55rem;border-radius:2px}
/* lightbox */
#glLightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;padding:1rem}
#glLightbox.open{display:flex}
#glLightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:0;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#glLightboxClose{position:absolute;top:1.2rem;right:1.5rem;color:#fff;font-size:2rem;cursor:pointer;line-height:1;opacity:.7;transition:opacity .2s}
#glLightboxClose:hover{opacity:1}
#glLightboxCaption{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:.9rem;max-width:600px;text-align:center;padding:.5rem 1rem;background:rgba(0,0,0,.4);border-radius:4px}
@media(max-width:900px){.nav{padding:0 1.5rem}.mobile-toggle{display:flex}.nav-links{display:none;position:fixed;top:68px;left:0;right:0;background:rgba(15,23,42,.97);backdrop-filter:blur(20px);flex-direction:column;padding:2rem;gap:.5rem}.nav-links.open{display:flex}.nav-li{border-bottom:1px solid rgba(255,255,255,.08);padding:0}.nav-link-item{display:block;font-size:1rem;font-weight:600;color:rgba(255,255,255,.9);padding:.65rem 0;letter-spacing:.01em;text-decoration:none;transition:color .2s;width:100%}.nav-link-item:hover{color:var(--ac)}.nav-dropdown{display:none}.nav-li.open .nav-dropdown{display:block;position:static;opacity:1;visibility:visible;transform:none;background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.1);border-radius:0;padding:.4rem;margin-top:.3rem;min-width:unset;box-shadow:none}.nav-li.has-dropdown>.nav-link-item::after{content:'▾';margin-left:.35rem;font-size:.65rem;opacity:.6;transition:transform .2s}.nav-li.has-dropdown.open>.nav-link-item::after{transform:rotate(180deg)}.nav-cta-btn{display:none!important}}
</style></head><body>

<footer style="background:#0F172A;padding:2rem;text-align:center"><div style="display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto"><p style="font-size:.8rem;color:rgba(255,255,255,.3)">© 2022–2026 조니딥 JourneyDeep. 조직문화 니즈를 딥하게.</p><a href="../admin/dashboard.html" style="font-size:.7rem;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.25);text-decoration:none;padding:.35rem .75rem;border:1px solid rgba(255,255,255,.1);transition:all .2s">관리</a></div></footer>

<script>
function toggleMenu(){document.getElementById('navLinks')?.classList.toggle('open')}
document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{document.getElementById('navLinks')?.classList.remove('open')}));
document.addEventListener('click',function(e){
  if(window.innerWidth>900)return;
  if(e.target.closest('.nav-dropdown a')){var nl=document.getElementById('navLinks');if(nl)nl.classList.remove('open');return;}
  var li=e.target.closest('.nav-li.has-dropdown');if(!li)return;
  if(e.target.closest('.nav-dropdown'))return;
  e.preventDefault();var isOpen=li.classList.contains('open');
  document.querySelectorAll('.nav-li.open').forEach(o=>o.classList.remove('open'));
  if(!isOpen)li.classList.add('open');
});

const SU='https://dvlrzbckneucpvlacdll.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';

var _allPhotos=[], _curSeason='전체';

function openLightbox(url,caption){
  document.getElementById('glLightboxImg').src=url;
  document.getElementById('glLightboxCaption').textContent=caption||'';
  document.getElementById('glLightbox').classList.add('open');
}
function closeLightbox(){document.getElementById('glLightbox').classList.remove('open');}
document.getElementById('glLightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});

function renderGrid(photos){
  var grid=document.getElementById('glGrid');
  if(!photos.length){grid.innerHTML='<p style="text-align:center;padding:4rem;color:#999">사진이 없습니다.</p>';return;}
  grid.innerHTML=photos.map(function(p){
    var season=p.season||'';
    var tag=season?'<div class="gl-season-tag">'+season+'</div>':'';
    return '<div class="gl-item" onclick="openLightbox(\''+p.image_url.replace(/'/g,"\\'")+'\',' +
      '\''+((p.caption||'').replace(/'/g,"\\'"))+'\')">'
      +'<img src="'+p.image_url+'" alt="'+(p.caption||'')+'" loading="lazy">'
      +'<div class="gl-overlay"></div>'
      +(p.caption?'<div class="gl-caption">'+p.caption+'</div>':'')
      +tag
      +'</div>';
  }).join('');
}

function filterBySeason(season, btn){
  _curSeason=season;
  document.querySelectorAll('.gl-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  var filtered=season==='전체'?_allPhotos:_allPhotos.filter(p=>p.season===season);
  renderGrid(filtered);
}

function buildTabs(photos){
  var seasons=['전체'];
  photos.forEach(function(p){if(p.season&&!seasons.includes(p.season))seasons.push(p.season);});
  // sort: 전체 first, then numeric desc
  var rest=seasons.slice(1).sort(function(a,b){
    var na=parseInt(a.match(/\d+/)||[0]),nb=parseInt(b.match(/\d+/)||[0]);return nb-na;
  });
  seasons=[seasons[0],...rest];
  var tabs=document.getElementById('glTabs');
  tabs.innerHTML=seasons.map(function(s,i){
    return '<button class="gl-tab'+(i===0?' active':'')+'" onclick="filterBySeason(\''+s+'\',this)">'+s+'</button>';
  }).join('');
}

fetch(SU+'/rest/v1/JD_gallery?select=image_url,caption,season,sort_order&visible=eq.true&order=sort_order.asc,created_at.asc',
  {headers:{'apikey':SK,'Authorization':'Bearer '+SK}})
.then(function(r){return r.json();})
.then(function(photos){
  if(!Array.isArray(photos)||!photos.length){
    document.getElementById('glCount').textContent='아직 공개된 사진이 없습니다.';
    document.getElementById('glGrid').innerHTML='<p style="text-align:center;padding:4rem;color:#999">사진이 없습니다.</p>';
    return;
  }
  _allPhotos=photos;
  document.getElementById('glCount').textContent='총 '+photos.length+'장의 사진';
  buildTabs(photos);
  renderGrid(photos);
}).catch(function(){
  document.getElementById('glCount').textContent='사진을 불러오지 못했습니다.';
});
(function(){var SU='https://dvlrzbckneucpvlacdll.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';fetch(SU+'/rest/v1/JD_site_settings?select=key,value',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}}).then(function(r){return r.json();}).then(function(rows){if(!Array.isArray(rows))return;rows.forEach(function(row){if(row.key==='hero_gallery'&&row.value){var el=document.querySelector('.gl-hero');if(el){el.style.backgroundImage='url('+row.value+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center';}}});}).catch(function(){});})();
</script>

<script>
(function(){
  var SU='https://dvlrzbckneucpvlacdll.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';
  fetch(SU+'/rest/v1/JD_site_settings?key=eq.nav_config&select=value',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}})
    .then(function(r){return r.json();}).then(function(rows){
      if(!rows||!rows[0])return;
      var cfg=JSON.parse(rows[0].value);
      cfg.items.forEach(function(item){
        var span=document.querySelector('.nav-link-main[data-navid="'+item.id+'"]');
        if(!span)return;
        var li=span.closest('.nav-li');
        if(!li)return;
        if(item.visible===false){li.style.display='none';}
        else{
          li.style.display='';
          span.textContent=item.label;
          if(item.children){
            item.children.forEach(function(child){
              var el=document.querySelector('[data-navchild="'+child.id+'"]');
              if(!el)return;
              if(child.visible===false){el.style.display='none';}
              else{el.style.display='';el.textContent=child.label;}
            });
          }
        }
      });
    }).catch(function(){});
})();
</script>
